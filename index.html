
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
      <meta name="apple-mobile-web-app-capable" content="yes" />
      <!-- NOT black-translucent. That extended page pixels under the status bar,
           and from Safari 26 the system fills that inset with a Liquid Glass
           blur wherever it cannot sample a solid colour at the page's top edge
           — which our transparent header over the app gradient never gives it.
           iOS 27 turned that band into a visible wash over the whole header.
           "default" insets the web view below an opaque status bar instead, so
           there is no inset left to fill. Read once at INSTALL time: an
           already-installed home screen app must be removed and re-added
           before this takes effect. -->
      <meta name="apple-mobile-web-app-status-bar-style" content="default" />
      <meta name="apple-mobile-web-app-title" content="Holy Grails" />
      <!-- Boot value only, matched to the UnicornScene fallback the splash and
           loading screens actually paint (both are always dark). Once the app
           renders, App.tsx drives this from the in-app theme preference, which
           is what the status bar strip now sits against — prefers-color-scheme
           would track the OS rather than the app. -->
      <meta name="theme-color" content="#0E1013">
      <meta name="description" content="A Discogs companion app for managing your record collection.">
      <!-- Fonts: preconnect + direct link so the fetch starts before CSS parse.
           Only the weights actually used (400/500/600/700) are loaded. -->
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&family=Rock+Salt&family=Manufacturing+Consent&display=swap" />
      <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
      <link rel="shortcut icon" href="/favicon.ico" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <link rel="manifest" href="/site.webmanifest" />
      <title>Holy Grails · A Discogs companion app</title>
    </head>

    <body>
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
